name: priced-in
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: priced_in
      POSTGRES_USER: priced_in
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/db.py setup to create .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/seed:ro
      - ./db:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priced_in -d priced_in"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DB_HOST: db
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
